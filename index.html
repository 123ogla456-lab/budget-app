<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F6F0F3;
  --card:#FFFFFF;
  --cream:#FBF6EE;
  --coral:#FF6B7A;
  --coral-dark:#E8556A;
  --green:#146B57;
  --mint:#8ADCB9;
  --mustard:#F5B93C;
  --violet:#6C4EE3;
  --sky:#9DC7F5;
  --ink:#17161C;
  --muted:#8E8B9A;
  --shadow:0 6px 20px rgba(40,15,30,.06);
  --r-card:28px;
  --r-inner:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  padding-bottom:120px;
}
#app{max-width:460px;margin:0 auto;padding:16px 16px 0}
.card{background:var(--card);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card.cream{background:var(--cream)}
.muted{color:var(--muted)}
.cap{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.h{font-size:16px;font-weight:600;margin:0 0 14px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.fade-in{animation:fade .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 1. итоги месяца ---------- */
.hero{background:var(--coral);color:#fff;border-radius:var(--r-card);padding:22px;box-shadow:0 10px 26px rgba(255,107,122,.24);margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-54px;top:-74px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.11)}
.hero .cap{color:rgba(255,255,255,.78)}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.85);font-weight:500;margin-top:11px;position:relative}
.hduo{display:flex;gap:14px;margin-top:12px;position:relative}
.hduo>div{flex:1;min-width:0}
.hduo .lbl{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:5px}
.hduo .big{font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:5px;white-space:nowrap}
.hduo .hsep{flex:0 0 1px;width:1px;align-self:stretch;background:rgba(255,255,255,.28)}
.plan-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.24);margin-top:16px;overflow:hidden;position:relative}
.plan-bar i{display:block;height:100%;border-radius:999px;background:#fff;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* ---------- 2. период ---------- */
.tabs{display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow);margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:10px 0;border-radius:999px;cursor:pointer;transition:.22s}
.tabs button.on{background:var(--coral);color:#fff}
.duo{display:flex;gap:12px;margin-bottom:14px}
.duo>div{flex:1;border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow)}
.duo .in{background:var(--mint)}
.duo .out{background:var(--cream)}
.duo b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.duo .out b{color:var(--coral-dark)}
.duo .in b{color:var(--green)}

/* ---------- 3. категории ---------- */
.mini{display:flex;background:#F3EFF4;border-radius:999px;padding:4px}
.mini button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;transition:.2s}
.mini button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(40,15,30,.08)}
.addcat{border:0;background:#F3EFF4;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:19px;font-weight:600;cursor:pointer;line-height:1;flex:none}
.cat{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cat:last-child{margin-bottom:0}
.ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.cat .body{flex:1;min-width:0}
.cat .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .am{font-size:14.5px;font-weight:700;white-space:nowrap}
.track{height:8px;border-radius:999px;background:#F0ECF2;margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cat .pl{font-size:11.5px;font-weight:500;color:var(--muted);margin-top:5px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.empty{text-align:center;padding:14px 0;font-size:13px;color:var(--muted)}

/* ---------- 4. график ---------- */
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:none}
.legend{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:9px}
.lg:last-child{margin-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.lg span:first-of-type{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lg b{font-weight:700;font-size:13px}

/* ---------- 5. операции ---------- */
.tx{display:flex;align-items:center;gap:12px;padding:9px 0}
.tx .body{flex:1;min-width:0}
.tx .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .dt{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.tx .am{font-size:15px;font-weight:700;white-space:nowrap}
.tx .am.inc{color:var(--green)}
.src{font-size:11px;margin-left:5px;opacity:.55}

/* ---------- нижняя панель ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;background:linear-gradient(to top,var(--bg) 55%,rgba(246,240,243,0))}
.dock .inner{width:100%;max-width:460px;display:flex;gap:10px;pointer-events:auto}
.btn-main{flex:1;background:var(--coral);color:#fff;border:0;border-radius:999px;font:inherit;font-size:15.5px;font-weight:700;padding:16px;box-shadow:0 8px 22px rgba(255,107,122,.34);cursor:pointer;transition:transform .12s}
.btn-ico{width:54px;border:0;border-radius:999px;background:var(--card);font-size:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.btn-main:active,.btn-ico:active{transform:scale(.96)}

/* ---------- модалки ---------- */
.overlay{position:fixed;inset:0;background:rgba(23,22,28,.45);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:460px;border-radius:30px 30px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:999px;background:#E3D9DF;margin:6px auto 14px}
.sheet-h{font-size:18px;font-weight:700;margin:0 0 16px 4px}
.banner{background:var(--mustard);color:#3C2A00;border-radius:var(--r-inner);padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;gap:9px;align-items:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 7px 4px}
input[type=text],input[type=number],input[type=date]{width:100%;border:0;background:var(--card);border-radius:var(--r-inner);padding:15px 16px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
input#amount{font-size:28px;font-weight:700;letter-spacing:-.02em}
.seg{display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:11px 0;border-radius:999px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--green);color:#fff}
.seg button.on.exp{background:var(--coral)}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.catbtn{border:0;background:var(--card);border-radius:999px;padding:11px 14px;font:inherit;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:7px;transition:.18s;color:var(--ink)}
.catbtn.on{color:#fff}
.catbtn.new{background:transparent;box-shadow:none;border:1.5px dashed #D9CFD6;color:var(--muted)}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.pick{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.pick.on{transform:scale(1.06);box-shadow:0 0 0 3px var(--ink) inset}
.sw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;transition:.18s}
.sw.on{box-shadow:0 0 0 3px #fff inset,0 0 0 5px currentColor}
.items{background:var(--card);border-radius:var(--r-inner);padding:6px 14px;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F3EEF1;font-size:14px}
.item:last-child{border-bottom:0}
.item .nm{flex:1}
.item.off{opacity:.35}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid #E0D7DD;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.cb.on{background:var(--green);border-color:var(--green)}
.save{width:100%;border:0;border-radius:999px;background:var(--coral);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:17px;margin-top:6px;box-shadow:0 8px 22px rgba(255,107,122,.34);cursor:pointer}
.ghost{width:100%;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:14px;margin-top:2px;cursor:pointer}

/* распознавание / запись */
.proc{position:fixed;inset:0;background:rgba(246,240,243,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60;gap:18px;text-align:center;padding:24px}
.proc.show{display:flex}
.spin{width:52px;height:52px;border-radius:50%;border:4px solid #EFE3E8;border-top-color:var(--coral);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.proc .t{font-size:16px;font-weight:600}
.mic{width:104px;height:104px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,122,.45)}50%{box-shadow:0 0 0 22px rgba(255,107,122,0)}}
.timer{font-size:26px;font-weight:700;letter-spacing:.02em}
.stop{border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:700;padding:15px 40px;cursor:pointer}
.heard{background:var(--card);border-radius:var(--r-inner);padding:14px 16px;box-shadow:var(--shadow);font-size:14px;font-style:italic;margin-bottom:14px;color:#4A4756}

/* ошибка загрузки */
#err{display:none;min-height:80vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px}
#err .e{font-size:44px}
#err .t{font-size:17px;font-weight:700}
#err .d{font-size:13.5px;color:var(--muted);max-width:250px}
#err button{border:0;border-radius:999px;background:var(--coral);color:#fff;font:inherit;font-size:15px;font-weight:700;padding:14px 32px;margin-top:6px;cursor:pointer}
#skeleton{padding-top:40px;text-align:center}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="app">
  <div id="skeleton"><div class="spin" style="margin:0 auto"></div></div>
  <div id="err">
    <div class="e">📊</div>
    <div class="t">Не удалось загрузить данные</div>
    <div class="d">Файл data.json не найден или повреждён. Проверь, что он лежит рядом с приложением.</div>
    <button onclick="boot()">Повторить</button>
  </div>
  <div id="screen" style="display:none"></div>
</div>

<div class="dock" id="dock" style="display:none">
  <div class="inner">
    <button class="btn-main" onclick="openForm(null,null)">Добавить операцию</button>
    <button class="btn-ico" onclick="startReceipt()" title="Добавить по чеку" aria-label="Добавить по чеку">📷</button>
    <button class="btn-ico" onclick="startVoice()" title="Добавить голосом" aria-label="Добавить голосом">🎙️</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" capture="environment" style="display:none">

<!-- распознавание -->
<div class="proc" id="proc">
  <div class="spin"></div>
  <div class="t" id="procText">Распознаю чек…</div>
  <div class="cap">это демо-режим, реальное распознавание подключается на следующем этапе</div>
</div>

<!-- запись голоса -->
<div class="proc" id="rec">
  <div class="mic">🎙️</div>
  <div class="timer" id="timer">00:00</div>
  <div class="cap">говори — например «потратила 1200 на продукты»</div>
  <button class="stop" onclick="stopVoice()">Стоп</button>
</div>

<!-- форма операции -->
<div class="overlay" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<!-- форма категории -->
<div class="overlay" id="catModal">
  <div class="sheet" id="catSheet"></div>
</div>

<script>
/* ---------- Telegram ---------- */
(function(){
  try{
    if(window.Telegram && window.Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      if(Telegram.WebApp.setHeaderColor) Telegram.WebApp.setHeaderColor('#F6F0F3');
    }
  }catch(e){}
})();

/* ---------- состояние ---------- */
var D=null, period='month', catMode='expense', today=new Date(),
    receiptIdx=0, voiceIdx=0, recTimer=null, nextId=1;
var form={type:'expense',categoryId:null,items:null,badge:null,heard:null,amount:'',note:'',date:''};
var newCat={type:'expense',name:'',plan:'',icon:'🛒',color:'#FF6B7A',returnToForm:false};

var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var SRC={manual:'✋',receipt:'📷',voice:'🎙️'};
var ICONS=['🛒','☕','🏠','🚕','💊','🎬','👗','✈️','🎁','📚','🐾','💇','💼','✨','💰','📈'];
var COLORS=['#FF6B7A','#F5B93C','#146B57','#9DC7F5','#8ADCB9','#6C4EE3','#E86FA8','#5AB0A6'];

function money(n){
  var s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (n<0?'−':'')+s+' '+(D&&D.currency?D.currency:'₽');
}
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function cat(id){for(var i=0;i<D.categories.length;i++){if(D.categories[i].id===id)return D.categories[i];}return {name:'Без категории',color:'#8E8B9A',icon:'•',plan:0};}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- загрузка ---------- */
function boot(){
  document.getElementById('err').style.display='none';
  document.getElementById('screen').style.display='none';
  document.getElementById('dock').style.display='none';
  document.getElementById('skeleton').style.display='block';

  fetch('data.json?v='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(j){
      if(!j||!Array.isArray(j.categories)||!Array.isArray(j.transactions)) throw new Error('bad');
      D=j;
      today = j.today ? parseD(j.today) : new Date();
      nextId = D.transactions.reduce(function(m,t){return Math.max(m, t.id||0);},0)+1;
      document.getElementById('skeleton').style.display='none';
      document.getElementById('screen').style.display='block';
      document.getElementById('dock').style.display='flex';
      render();
    })
    .catch(function(){
      document.getElementById('skeleton').style.display='none';
      document.getElementById('err').style.display='flex';
    });
}

/* ---------- расчёты ---------- */
function inPeriod(t){
  var d=parseD(t.date);
  if(period==='day') return t.date===ymd(today);
  if(period==='week'){
    var from=new Date(today.getFullYear(),today.getMonth(),today.getDate()-6);
    return d>=from && d<=today;
  }
  return d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth();
}
function inMonth(t){
  var d=parseD(t.date);
  return d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth();
}
function sum(list,type){
  return list.filter(function(t){return t.type===type;}).reduce(function(a,t){return a+t.amount;},0);
}
function stats(){
  var per=D.transactions.filter(inPeriod);
  var mon=D.transactions.filter(inMonth);
  var spentMonth=sum(mon,'expense');
  var daysIn=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  return {
    per:per, mon:mon,
    inc:sum(per,'income'), exp:sum(per,'expense'),
    monInc:sum(mon,'income'), monExp:spentMonth,
    daysLeft:daysIn-today.getDate()+1,
    used: D.monthlyPlan ? spentMonth/D.monthlyPlan : 0
  };
}
function stateColor(r){ return r>1 ? 'var(--coral)' : (r>=.8 ? 'var(--mustard)' : 'var(--green)'); }

/* ---------- отрисовка ---------- */
function render(){
  var s=stats();
  var h='';

  /* 1. итоги месяца */
  h+='<div class="hero fade-in">'
   + '<div class="cap">'+MONTHS_N[today.getMonth()]+' '+today.getFullYear()+' · итого за месяц</div>'
   + '<div class="hduo">'
   + '<div><div class="lbl">↓ Доходы</div><div class="big">'+money(s.monInc)+'</div></div>'
   + '<div class="hsep"></div>'
   + '<div><div class="lbl">↑ Расходы</div><div class="big">'+money(s.monExp)+'</div></div>'
   + '</div>'
   + '<div class="plan-bar"><i style="width:'+Math.min(100,s.used*100).toFixed(1)+'%"></i></div>'
   + '<div class="sub">'+Math.round(s.used*100)+'% плана расходов ('+money(D.monthlyPlan)+') · осталось '+s.daysLeft+' дн.</div>'
   + '</div>';

  /* 2. период */
  var tabs=[['day','День'],['week','Неделя'],['month','Месяц']];
  h+='<div class="tabs">'+tabs.map(function(t){
    return '<button class="'+(period===t[0]?'on':'')+'" onclick="setPeriod(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('')+'</div>';

  if(period!=='month'){
    h+='<div class="duo fade-in">'
     + '<div class="in"><div class="cap">Доходы за '+(period==='day'?'день':'неделю')+'</div><b>+'+money(s.inc)+'</b></div>'
     + '<div class="out"><div class="cap">Расходы за '+(period==='day'?'день':'неделю')+'</div><b>−'+money(s.exp)+'</b></div>'
     + '</div>';
  }

  /* 3. категории — расходы и доходы */
  var list=D.categories.filter(function(c){return c.type===catMode;}).map(function(c){
    var f=s.mon.filter(function(t){return t.categoryId===c.id&&t.type===catMode;})
               .reduce(function(a,t){return a+t.amount;},0);
    return {c:c,fact:f,ratio:c.plan?f/c.plan:0};
  }).sort(function(a,b){return b.fact-a.fact;});
  if(catMode==='expense') list=list.slice(0,5);

  h+='<div class="card fade-in"><div class="row between" style="margin-bottom:16px;gap:10px">'
   + '<div class="mini">'
   + '<button class="'+(catMode==='expense'?'on':'')+'" onclick="setCatMode(\'expense\')">Расходы</button>'
   + '<button class="'+(catMode==='income'?'on':'')+'" onclick="setCatMode(\'income\')">Доходы</button>'
   + '</div>'
   + '<button class="addcat" onclick="openCatForm(\''+catMode+'\',false)" title="Новая категория" aria-label="Новая категория">+</button>'
   + '</div>';

  if(!list.length){
    h+='<div class="empty">Категорий пока нет — добавь первую кнопкой «+»</div>';
  }
  list.forEach(function(x){
    var pct=Math.round(x.ratio*100);
    var col = catMode==='income' ? 'var(--green)' : stateColor(x.ratio);
    var badge='';
    if(catMode==='expense'){
      badge = x.ratio>1
        ? '<span class="pill" style="background:#FFE8EB;color:var(--coral-dark)">+'+money(x.fact-x.c.plan)+'</span>'
        : (x.ratio>=.8?'<span class="pill" style="background:#FDF1DA;color:#9A6B00">почти лимит</span>':'');
    }else if(x.ratio>=1){
      badge='<span class="pill" style="background:#DFF5EA;color:var(--green)">план выполнен</span>';
    }
    h+='<div class="cat">'
     + '<div class="ico" style="background:'+x.c.color+'22">'+x.c.icon+'</div>'
     + '<div class="body"><div class="top"><div class="nm">'+esc(x.c.name)+'</div><div class="am">'+money(x.fact)+'</div></div>'
     + '<div class="track"><i style="width:'+Math.min(100,pct)+'%;background:'+col+'"></i></div>'
     + '<div class="pl">'+pct+'% от '+money(x.c.plan||0)+badge+'</div>'
     + '</div></div>';
  });
  h+='</div>';

  /* 4. график */
  var byCat={};
  s.per.filter(function(t){return t.type==='expense';}).forEach(function(t){
    byCat[t.categoryId]=(byCat[t.categoryId]||0)+t.amount;
  });
  var parts=Object.keys(byCat).map(function(k){return {c:cat(k),v:byCat[k]};}).sort(function(a,b){return b.v-a.v;});
  var tot=parts.reduce(function(a,p){return a+p.v;},0);

  h+='<div class="card fade-in"><div class="h">Куда уходят деньги</div>';
  if(!tot){
    h+='<div class="empty">За этот период расходов пока нет</div>';
  }else{
    var R=52,C=2*Math.PI*R,off=0,segs='';
    parts.forEach(function(p){
      var frac=p.v/tot, len=Math.max(0,C*frac-4);
      segs+='<circle r="'+R+'" cx="70" cy="70" fill="none" stroke="'+p.c.color+'" stroke-width="20" stroke-linecap="round"'
          + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"></circle>';
      off+=C*frac;
    });
    h+='<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg)">'
     + '<circle r="52" cx="70" cy="70" fill="none" stroke="#F3EEF1" stroke-width="20"></circle>'+segs+'</svg>'
     + '<div class="legend">'
     + parts.slice(0,5).map(function(p){
         return '<div class="lg"><div class="dot" style="background:'+p.c.color+'"></div>'
              + '<span>'+esc(p.c.name)+'</span><b>'+Math.round(p.v/tot*100)+'%</b></div>';
       }).join('')
     + '</div></div>'
     + '<div style="text-align:center;margin-top:10px"><div class="cap">всего за период</div>'
     + '<div style="font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px">'+money(tot)+'</div></div>';
  }
  h+='</div>';

  /* 5. последние операции */
  var last=D.transactions.slice().sort(function(a,b){
    return a.date===b.date ? (b.id||0)-(a.id||0) : (a.date<b.date?1:-1);
  }).slice(0,5);
  h+='<div class="card cream fade-in"><div class="h">Последние операции</div>';
  last.forEach(function(t){
    var c=cat(t.categoryId), d=parseD(t.date);
    h+='<div class="tx"><div class="ico" style="background:'+c.color+'22">'+c.icon+'</div>'
     + '<div class="body"><div class="nm">'+esc(t.note||c.name)+'</div>'
     + '<div class="dt">'+esc(c.name)+' · '+d.getDate()+' '+MONTHS[d.getMonth()]+'<span class="src">'+(SRC[t.source]||'')+'</span></div></div>'
     + '<div class="am '+(t.type==='income'?'inc':'')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</div></div>';
  });
  h+='</div>';

  document.getElementById('screen').innerHTML=h;
}
function setPeriod(p){ period=p; render(); }
function setCatMode(m){ catMode=m; render(); }

/* ---------- форма операции ---------- */
function openForm(prefill,badge){
  form={type:'expense',categoryId:null,items:null,badge:badge||null,heard:null,amount:'',note:'',date:ymd(today),source:null};
  if(prefill){
    form.type=prefill.type||'expense';
    form.categoryId=prefill.categoryId||null;
    form.amount=prefill.amount||'';
    form.note=prefill.note||'';
    form.date=prefill.date&&prefill.date!=='today'?prefill.date:ymd(today);
    form.items=prefill.items||null;
    form.heard=prefill.heard||null;
  }
  drawForm();
  document.getElementById('modal').classList.add('show');
}
function closeForm(){ document.getElementById('modal').classList.remove('show'); }

function drawForm(){
  var h='<div class="grab"></div>';
  if(form.badge) h+='<div class="banner">'+form.badge+'</div>';
  if(form.heard) h+='<div class="heard">«'+esc(form.heard)+'»</div>';

  h+='<div class="field"><label>Сумма</label>'
   + '<input type="number" inputmode="decimal" id="amount" placeholder="0" value="'+(form.amount||'')+'" oninput="form.amount=this.value"></div>';

  h+='<div class="field"><label>Тип операции</label><div class="seg">'
   + '<button class="'+(form.type==='expense'?'on exp':'')+'" onclick="setType(\'expense\')">Расход</button>'
   + '<button class="'+(form.type==='income'?'on':'')+'" onclick="setType(\'income\')">Доход</button>'
   + '</div></div>';

  h+='<div class="field"><label>Категория '+(form.type==='expense'?'расхода':'дохода')+'</label><div class="catgrid">'
   + D.categories.filter(function(c){return c.type===form.type;}).map(function(c){
       var on=form.categoryId===c.id;
       return '<button class="catbtn '+(on?'on':'')+'" style="'+(on?'background:'+c.color:'')+'" onclick="setCat(\''+c.id+'\')">'
            + '<span>'+c.icon+'</span>'+esc(c.name)+'</button>';
     }).join('')
   + '<button class="catbtn new" onclick="openCatForm(\''+form.type+'\',true)">＋ Новая</button>'
   + '</div></div>';

  if(form.items&&form.items.length){
    h+='<div class="field"><label>Позиции чека</label><div class="items">'
     + form.items.map(function(it,i){
         return '<div class="item '+(it.on?'':'off')+'" onclick="toggleItem('+i+')">'
              + '<div class="cb '+(it.on?'on':'')+'">'+(it.on?'✓':'')+'</div>'
              + '<div class="nm">'+esc(it.name)+'</div><b>'+money(it.amount)+'</b></div>';
       }).join('')
     + '</div></div>';
  }

  h+='<div class="field"><label>Дата</label><input type="date" value="'+form.date+'" onchange="form.date=this.value"></div>';
  h+='<div class="field"><label>Заметка</label><input type="text" placeholder="необязательно" value="'+esc(form.note)+'" oninput="form.note=this.value"></div>';
  h+='<button class="save" onclick="save()">Сохранить</button><button class="ghost" onclick="closeForm()">Отмена</button>';

  document.getElementById('sheet').innerHTML=h;
}
function setType(t){ if(form.type!==t){form.type=t;form.categoryId=null;} drawForm(); }
function setCat(id){ form.categoryId=id; drawForm(); }
function toggleItem(i){
  form.items[i].on=!form.items[i].on;
  form.amount=form.items.filter(function(x){return x.on;}).reduce(function(a,x){return a+x.amount;},0);
  drawForm();
}
function save(){
  var a=parseFloat(form.amount);
  if(!a||a<=0){ alertish('Укажи сумму'); return; }
  if(!form.categoryId){ alertish('Выбери категорию'); return; }
  D.transactions.push({
    id:nextId++, date:form.date, categoryId:form.categoryId, type:form.type,
    amount:a, note:form.note||'', source:form.source||(form.items?'receipt':(form.heard?'voice':'manual'))
  });
  closeForm();
  render();
  try{ if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success'); }catch(e){}
}
function alertish(msg){
  var b=document.querySelector('#sheet .banner');
  if(!b){
    b=document.createElement('div'); b.className='banner';
    document.getElementById('sheet').insertBefore(b,document.getElementById('sheet').children[1]);
  }
  b.style.background='var(--coral)'; b.style.color='#fff'; b.textContent='⚠️ '+msg;
}

/* ---------- категории: создание ---------- */
function openCatForm(type,fromForm){
  var used=D.categories.map(function(c){return c.color;});
  var free=COLORS.filter(function(c){return used.indexOf(c)<0;});
  newCat={type:type,name:'',plan:'',icon:type==='income'?'💰':'🛒',
          color:free.length?free[0]:COLORS[D.categories.length%COLORS.length],returnToForm:!!fromForm};
  drawCatForm();
  document.getElementById('catModal').classList.add('show');
}
function closeCatForm(){ document.getElementById('catModal').classList.remove('show'); }

function drawCatForm(){
  var h='<div class="grab"></div><div class="sheet-h">Новая категория</div>';
  h+='<div class="field"><label>Тип</label><div class="seg">'
   + '<button class="'+(newCat.type==='expense'?'on exp':'')+'" onclick="setNewType(\'expense\')">Расход</button>'
   + '<button class="'+(newCat.type==='income'?'on':'')+'" onclick="setNewType(\'income\')">Доход</button>'
   + '</div></div>';
  h+='<div class="field"><label>Название</label>'
   + '<input type="text" id="catName" placeholder="'+(newCat.type==='income'?'Например, Аренда квартиры':'Например, Красота')+'" value="'+esc(newCat.name)+'" oninput="newCat.name=this.value"></div>';
  h+='<div class="field"><label>'+(newCat.type==='income'?'План дохода на месяц, ₽':'Лимит на месяц, ₽')+'</label>'
   + '<input type="number" inputmode="numeric" placeholder="0" value="'+(newCat.plan||'')+'" oninput="newCat.plan=this.value"></div>';
  h+='<div class="field"><label>Иконка</label><div class="picker">'
   + ICONS.map(function(i){
       return '<button class="pick '+(newCat.icon===i?'on':'')+'" onclick="newCat.icon=\''+i+'\';drawCatForm()">'+i+'</button>';
     }).join('')+'</div></div>';
  h+='<div class="field"><label>Цвет</label><div class="picker">'
   + COLORS.map(function(c){
       return '<button class="sw '+(newCat.color===c?'on':'')+'" style="background:'+c+';color:'+c+'" onclick="newCat.color=\''+c+'\';drawCatForm()" aria-label="цвет '+c+'"></button>';
     }).join('')+'</div></div>';
  h+='<button class="save" onclick="saveCat()">Создать категорию</button>'
   + '<button class="ghost" onclick="closeCatForm()">Отмена</button>';
  document.getElementById('catSheet').innerHTML=h;
}
function setNewType(t){
  newCat.type=t;
  newCat.icon = t==='income' ? '💰' : '🛒';
  drawCatForm();
}
function saveCat(){
  var name=(newCat.name||'').trim();
  if(!name){
    var b=document.querySelector('#catSheet .banner');
    if(!b){ b=document.createElement('div'); b.className='banner';
      document.getElementById('catSheet').insertBefore(b,document.getElementById('catSheet').children[2]); }
    b.style.background='var(--coral)'; b.style.color='#fff'; b.textContent='⚠️ Как назовём категорию?';
    return;
  }
  var id='c'+Date.now();
  D.categories.push({
    id:id, name:name, type:newCat.type, plan:parseFloat(newCat.plan)||0,
    color:newCat.color, icon:newCat.icon
  });
  closeCatForm();
  if(newCat.returnToForm){
    form.type=newCat.type;
    form.categoryId=id;
    drawForm();
  }else{
    catMode=newCat.type;
  }
  render();
}

/* ---------- сценарий «Чек» (демо-заглушка) ---------- */
function startReceipt(){
  var f=document.getElementById('file');
  f.value='';
  f.onchange=function(){ runReceipt(); };
  f.click();
  // если пользователь отменил выбор файла — ничего не происходит
}
function runReceipt(){
  var p=document.getElementById('proc');
  document.getElementById('procText').textContent='Распознаю чек…';
  p.classList.add('show');
  setTimeout(function(){
    p.classList.remove('show');
    // TODO: здесь будет вызов API распознавания чека
    var list=D.mockReceipts||[];
    if(!list.length){ openForm(null,'📷 Чек загружен, заполни вручную'); return; }
    var r=list[receiptIdx%list.length]; receiptIdx++;
    var items=(r.items||[]).map(function(it){return {name:it.name,amount:it.amount,on:true};});
    openForm({
      type:r.type||'expense', categoryId:r.categoryId,
      amount:items.length?items.reduce(function(a,x){return a+x.amount;},0):r.total,
      note:r.merchant, date:r.date, items:items.length?items:null
    },'📷 Распознано с чека, проверь и поправь');
    form.source='receipt';
  },1500);
}

/* ---------- сценарий «Голос» (демо-заглушка) ---------- */
function startVoice(){
  var r=document.getElementById('rec'), t=0;
  document.getElementById('timer').textContent='00:00';
  r.classList.add('show');
  recTimer=setInterval(function(){
    t++;
    document.getElementById('timer').textContent=
      String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  },1000);
}
function stopVoice(){
  clearInterval(recTimer);
  document.getElementById('rec').classList.remove('show');
  var p=document.getElementById('proc');
  document.getElementById('procText').textContent='Расшифровываю…';
  p.classList.add('show');
  setTimeout(function(){
    p.classList.remove('show');
    // TODO: здесь будет вызов API распознавания речи
    var list=D.mockVoice||[];
    if(!list.length){ openForm(null,'🎙️ Не удалось разобрать, заполни вручную'); return; }
    var v=list[voiceIdx%list.length]; voiceIdx++;
    var pr=v.parsed||{};
    openForm({
      type:pr.type||'expense', categoryId:pr.categoryId, amount:pr.amount,
      note:pr.note||'', date:pr.date, heard:v.text
    },'🎙️ Распознано с голоса, проверь и поправь');
    form.source='voice';
  },1500);
}

document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeForm(); });
document.getElementById('catModal').addEventListener('click',function(e){ if(e.target===this) closeCatForm(); });
boot();
</script>
